version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          production:
              dependency-type: production
          dev:
              dependency-type: development
      open-pull-requests-limit: 10
      ignore:
          # TypeScript 7.x (Go-native) has no programmatic API or plugin mechanism;
          # vtsls and @vue/typescript-plugin structurally require the TS 6 JS API.
          # 6.0.3 is the end of the 6.x line — do not offer major updates.
          - dependency-name: typescript
            update-types: ['version-update:semver-major']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
