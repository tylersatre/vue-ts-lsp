name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20, 22, 24]
            fail-fast: false
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            # stdout is the JSON-RPC transport: any stray write corrupts the protocol.
            # The only legitimate process.stdout reference is the StreamMessageWriter
            # in src/upstream.ts, which this pattern deliberately does not match.
            - name: Stdout safety check
              run: |
                  if grep -rnE 'console\.(log|info|warn|dir|table)|process\.stdout\.write' src/; then
                    echo "::error::stdout-writing call found in source — stdout is the JSON-RPC transport"
                    exit 1
                  fi

            - name: Format check
              run: npm run format:check

            - name: Typecheck
              run: npm run typecheck

            - name: Install smoke fixture dependencies
              run: npm run install:smoke-fixture

            - name: Test (with coverage thresholds)
              run: npm run test:coverage
              timeout-minutes: 10
