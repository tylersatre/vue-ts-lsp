name: Release

on:
    push:
        branches: [main]

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - run: npm ci

            # Same guard as CI: this workflow publishes, so it must never ship a
            # stray stdout write (stdout is the JSON-RPC transport).
            - name: Stdout safety check
              run: |
                  if grep -rnE 'console\.[A-Za-z]+\(|process\.stdout' src/ | grep -v 'StreamMessageWriter(process.stdout)'; then
                    echo "::error::stdout-writing call found in source — stdout is the JSON-RPC transport"
                    exit 1
                  fi

            - name: Typecheck
              run: npm run typecheck

            - name: Install smoke fixture dependencies
              run: npm run install:smoke-fixture

            - name: Test
              run: npm test

            # Publishing relies on npm trusted publishing (OIDC via id-token: write +
            # npm >= 11 on Node 24) — there is deliberately no NPM_TOKEN here. It only
            # works while the trusted-publisher entry for vue-ts-lsp exists on
            # npmjs.com; if that entry is lost, this step fails with a bare auth error.
            - name: Create release PR or GitHub Release
              uses: changesets/action@v1
              with:
                  title: 'Version Packages'
                  commit: 'chore: version packages'
                  version: npm run version-packages
                  publish: npm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
